# Calls the probe at one ref form per run, so three runs answer three questions.
#
# 🚧 **Disposable**, with `kit-ref-probe.yml` and the two probe tags.
#
# ```sh
# gh workflow run kit-ref-probe-caller.yml -f form=branch
# ```
#
# 🔑 **One job per ref form, because `uses:` cannot take an expression.** A ref
# in `uses:` is literal, so a single parameterised job is not expressible and
# three gated jobs are the whole of the trick. `workflow_dispatch` is what makes
# a re-run free: no commit, no push, no tag.
#
# **Run them in this order**, which is cheapest-signal-first:
#
# | Form | Separates |
# |---|---|
# | `branch` | "tags do not populate it" from "nothing populates it" |
# | `lightweight` | an annotated tag from tags in general |
# | `annotated` | nothing — it is the form all three releases take, and the one that has to work |
#
# ⚠️ **If a lightweight tag works and an annotated one does not, do not fix it
# by changing how this kit tags.** §12.3 says a consumer pins a tag and says
# nothing about which kind, so a workflow that serves one kind is a trap for
# whoever tags the next release without knowing which they made. Fix the
# workflow, or write the restriction into §12.3 where somebody will read it.
#
# 🚨 **Every ref in this file has to resolve before *any* form can run.**
# GitHub validates each `uses:` at parse time, including jobs an `if` will
# skip. ✅ Measured 2026-09-12: the `branch` form, which touches neither tag,
# failed with `failed to fetch workflow: reference to workflow should be either
# a valid branch, tag, or commit` naming the *annotated* job's stale ref.
#
# Two consequences, and the second is a trap:
#
# * both tags must exist before the first run, even the `branch` one.
# * **delete the caller before the tags.** Deleting the tags first breaks this
#   file for every form rather than for the two that use them.
#
# The tags, on a commit that carries `kit-ref-probe.yml`:
#
# ```sh
# git -c tag.gpgsign=false tag 0.3.1-probe.lightweight <commit>
# git tag -a -m probe 0.3.1-probe.annotated <commit>
# ```
#
# ⚠️ **`-c tag.gpgsign=false` is not optional on Mike's machine**, where
# `tag.gpgsign` is `true` globally: a bare `git tag <name> <commit>` fails with
# "no tag message?" and every tag he makes is annotated by configuration rather
# than by choice. 🔑 **So "use a lightweight tag" is not a fix available to him**
# if the annotated form turns out to be the broken one. §11.2.1 carries that.
#
# The names are SemVer pre-release identifiers because GitHub refused
# `ci-probe-*`. They sort below any real 0.3.1 and still read as disposable.

name: Kit ref probe caller

on:
  workflow_dispatch:
    inputs:
      form:
        description: Which ref form to call the probe at
        type: choice
        required: true
        default: branch
        options:
          - branch
          - lightweight
          - annotated

jobs:
  # 🚨 The full cross-repository path on purpose, never `./.github/workflows/…`.
  # The local form is a different call shape, so proving something about it
  # would prove something about a path no consumer takes.
  branch:
    if: inputs.form == 'branch'
    uses: mike-bronner/herdr-plugin-kit/.github/workflows/kit-ref-probe.yml@main

  lightweight:
    if: inputs.form == 'lightweight'
    uses: mike-bronner/herdr-plugin-kit/.github/workflows/kit-ref-probe.yml@0.3.1-probe.lightweight

  annotated:
    if: inputs.form == 'annotated'
    uses: mike-bronner/herdr-plugin-kit/.github/workflows/kit-ref-probe.yml@0.3.1-probe.annotated
