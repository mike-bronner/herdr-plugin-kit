name: Mutation

# Does the suite actually notice when a guarded behaviour breaks?
#
# 🚨 Separate from kit-ci.yml on purpose, and this is the decision rather than
# a filing convenience. The harness recompiles the crate once per mutation and
# there are a hundred and sixty-four of them, so a run costs minutes rather than
# seconds.
# Two failures were weighed against each other:
#
#   - Folding it into the fast gate makes every pull request wait for it, and a
#     check people wait twenty minutes for is a check people learn to route
#     around.
#   - Leaving it to be run by hand is worse. `just mutate` is documented, and a
#     check nobody runs on a schedule is a check that rots into a claim.
#
# So it runs on every push to main that could have changed the answer, and on
# demand. Landing on main is where this repository actually works today, so
# that is the tightest automatic trigger available; it reports after the fact
# rather than gating, which is the right trade for a twenty-minute check.
#
# 🔑 The paths filter is why this is its own file. A filter applies to a
# workflow, never to one job inside it, so a documentation commit cannot
# trigger twenty minutes of recompiling from inside kit-ci.yml.
#
# Each spec runs as its own leg rather than in one loop: they are independent,
# and in parallel the wall clock is the slowest spec rather than the sum.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'tools/mutate.py'
      - 'tools/mutations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/kit-mutation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 🚨 The specs are read from the directory, never listed here, and that is
  # the same fix `--all-features` was rather than a tidier way to write four
  # paths. A hand-maintained list says nothing when it goes stale: `update`
  # shipped with no spec at all, the matrix stayed green across two releases,
  # and nothing anywhere reported that a module was uncovered. A list of the
  # things to check cannot itself be the thing that decides what to check.
  #
  # ⚠️ An empty result fails loudly instead of producing a matrix of zero jobs.
  # A workflow that runs nothing and reports success is the same silent green
  # this job exists to end, and it is the failure mode a glob introduces.
  discover:
    name: Find the specs
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.find.outputs.specs }}
    steps:
      - uses: actions/checkout@v7

      - id: find
        name: List every spec under tools/mutations
        run: |
          specs="$(find tools/mutations -maxdepth 1 -name '*.json' \
            | sort | jq -R -s -c 'split("\n")[:-1]')"
          if [ "$specs" = '[]' ]; then
            echo "::error::no mutation specs found under tools/mutations"
            exit 1
          fi
          echo "found $specs"
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

  mutate:
    name: ${{ matrix.spec }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # A surviving mutation in one module says nothing about the others, and
      # every answer is wanted in the same run.
      fail-fast: false
      matrix:
        spec: ${{ fromJSON(needs.discover.outputs.specs) }}
    steps:
      - uses: actions/checkout@v7

      # Warm the build once, so the per-mutation cost is an incremental
      # rebuild rather than a cold one a hundred and sixty-four times over.
      #
      # `--all-features` rather than each spec's own set: it warms every
      # dependency for every job, and a named list goes stale the day a feature
      # is added. The crate itself still compiles once per feature set, which is
      # one build rather than one per mutation.
      - name: Build the unmutated tree first
        run: cargo test --locked --all-features --no-run

      - name: Break one thing at a time
        run: python3 tools/mutate.py ${{ matrix.spec }}
