# What a called workflow is actually told about who called it.
#
# 🚧 **Disposable.** This exists to answer one question that cannot be answered
# locally, and it should be deleted with its caller and its tags once SCOPE.md
# §11.2.1 records the answer.
#
# The question: `plugin-ci.yml` resolves which kit to check a plugin against
# from the call context, and on its first real call (recent-spaces run
# 34708262498, 2026-09-12) `github.job_workflow_sha` was **empty**. Nothing
# reproduces a GitHub Actions context on a laptop, so the values have to be
# read off a real run.
#
# 🔑 **It prints and decides nothing.** The resolution logic lives in
# `plugin-ci.yml` and `plugin-release.yml` and is tested against fabricated
# contexts by `tools/test_workflow_ref.py`. What is unknown is not what the
# logic does with a context, it is what the context contains. So this answers
# only that, and a second copy of the logic here would be a third thing to keep
# in step for no gain.
#
# ⚠️ **Its caller lives in this repository and calls it by the full
# cross-repository path**, which is the shape every consumer uses. Same
# repository is fine; the same *syntax* is what matters, because the local
# `./.github/workflows/…` form is a different call shape and may populate the
# context differently. The residual risk is that a caller inside the kit is
# told something a caller outside it is not, and only a real consumer run
# settles that.

name: Kit ref probe

on:
  workflow_call:

jobs:
  report:
    name: What this call is told
    runs-on: ubuntu-latest
    steps:
      - name: Print every candidate
        env:
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
        run: |
          echo "github.job_workflow_sha = ${JOB_WORKFLOW_SHA:-<empty>}"
          echo "github.job_workflow_ref = ${JOB_WORKFLOW_REF:-<empty>}"
          echo "github.workflow_ref     = ${WORKFLOW_REF:-<empty>}"
          echo "github.workflow_sha     = ${WORKFLOW_SHA:-<empty>}"
          echo "github.sha              = ${EVENT_SHA:-<empty>}"
          echo "github.ref              = ${EVENT_REF:-<empty>}"
          echo "github.repository       = ${EVENT_REPOSITORY:-<empty>}"
