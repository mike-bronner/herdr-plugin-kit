name: Plugin CI

# Reusable. Every Herdr plugin calls this instead of keeping its own copy.
#
#     # .github/workflows/ci.yml in the plugin
#     name: CI
#     on:
#       push:
#       pull_request:
#     jobs:
#       conformance:
#         uses: mike-bronner/herdr-plugin-kit/.github/workflows/plugin-ci.yml@0.3.0
#
# 🔑 There are no required inputs, and that is deliberate. Every fact this
# needs — the binary's name, the version — is already stated in the plugin's
# own manifests. An input repeating one of them is a second copy that can
# disagree with the first, and disagreeing about the binary's name is exactly
# the silent failure this workflow exists to catch.
#
# No toolchain input either, and nothing here asserts a floor. A plugin ships
# as a compiled binary, so a user installs one with no toolchain at all and a
# minimum version documents a requirement for people who will never compile.
# Every job takes the runner's own toolchain. SCOPE.md §11.8.1.
#
# 🪤 Trigger on push as well as pull_request in the caller. When a pull request
# cannot compute a merge ref against main, Actions skips its pull_request
# workflows entirely: no run, no error, and the checks never appear. SCOPE.md
# §11.7.
#
# Permissions: this one needs nothing beyond the default read. The release
# workflow is the one that needs the caller to grant `contents: write`.

on:
  workflow_call:
    inputs:
      test_os:
        description: >-
          The runner the plugin's own suite runs on. Defaults to ubuntu-latest.
          recent-spaces needs macos-latest, because its suite writes under
          /private/tmp, which does not exist on Linux.
        type: string
        default: ubuntu-latest
        required: false

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.table.outputs.matrix }}
    steps:
      # ⚠️ Both repositories land in subdirectories, neither inside the other.
      # A kit checkout nested under the plugin's root puts a second Cargo.toml
      # under a package cargo is about to read.
      - name: Take the plugin, with every tag
        uses: actions/checkout@v7
        with:
          path: plugin
          # The version gate reads the tag history, so a shallow clone would
          # let it pass by seeing no releases at all.
          fetch-depth: 0

      # 🔑 The kit that checks a plugin has to be the kit version that plugin
      # pinned, and no input names it: an input would be a second pin to keep
      # in step. So the call itself has to say, and 🚨 **the value documented
      # to say it was empty on the first real call** — recent-spaces run
      # 34708262498, caller pinned at an annotated tag, 2026-09-12.
      #
      # Fails closed, which is why that run cost a red build rather than a
      # plugin checked against the wrong kit.
      - name: Establish which kit this is
        id: kit
        env:
          # 🔑 Names the same repository as the checkout below, and both stay
          # literal: the line that decides what code runs should say so
          # without a lookup. tools/test_workflow_ref.py holds them together.
          KIT_REPO: mike-bronner/herdr-plugin-kit
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          # ---8<--- kit-ref resolution. Identical in plugin-ci.yml and
          # plugin-release.yml, and tools/test_workflow_ref.py runs this exact text and
          # fails if the two copies differ. It cannot live in tools/ like every other
          # piece of logic here, because it is what decides which tools/ to check out.
          #
          # Every candidate, every run. 🚨 The value documented to answer this was
          # empty on the first real call (recent-spaces run 34708262498, 2026-09-12),
          # and a guard that speaks only when it refuses teaches nothing about the run
          # that worked.
          echo "github.job_workflow_sha = ${JOB_WORKFLOW_SHA:-<empty>}"
          echo "github.job_workflow_ref = ${JOB_WORKFLOW_REF:-<empty>}"
          echo "github.workflow_ref     = ${WORKFLOW_REF:-<empty>}"
          echo "github.workflow_sha     = ${WORKFLOW_SHA:-<empty>}"
          echo "github.sha              = ${EVENT_SHA:-<empty>}"
          echo "github.ref              = ${EVENT_REF:-<empty>}"

          resolved=''
          answered_by=''

          # 1. A commit of this file. It needs no further checking: a sha from some
          #    other repository fails closed by itself, because it does not resolve in
          #    this one.
          case "$JOB_WORKFLOW_SHA" in
            [0-9a-f]*)
              if [ ${#JOB_WORKFLOW_SHA} -eq 40 ]; then
                resolved="$JOB_WORKFLOW_SHA"
                answered_by='github.job_workflow_sha'
              fi
              ;;
          esac

          # 2. A ref path, and only one this kit owns. Everything after the last '@' is
          #    what the runner already resolved this file at, so it takes a tag, a
          #    branch or a sha without caring which.
          #
          # 🚨 The repository check is the whole safety of this branch, and the
          #    asymmetry behind it is not obvious from the code: **a wrong sha fails
          #    closed by itself, because it does not resolve here. A wrong ref name
          #    does not, because a common branch name resolves everywhere.** So
          #    taking a caller's own ref would check the plugin against this kit's
          #    default branch and *pass*, which is the silent wrong-kit failure
          #    §11.2.1 exists to prevent, arriving through the fix for it.
          for candidate in "$JOB_WORKFLOW_REF" "$WORKFLOW_REF"; do
            [ -z "$resolved" ] || break
            case "$candidate" in
              "$KIT_REPO"/*@*)
                resolved="${candidate##*@}"
                answered_by='a ref path this kit owns'
                ;;
            esac
          done

          if [ -z "$resolved" ]; then
            echo "no context value named the kit to check this plugin against." >&2
            echo "One of the values above has to carry either a 40-character commit" >&2
            echo "of ${KIT_REPO}, or a ref path beginning ${KIT_REPO}/." >&2
            echo "Nothing is guessed here: an unresolved ref would check out the" >&2
            echo "default branch and check this plugin against the wrong kit." >&2
            exit 1
          fi

          echo "the kit is ${resolved}, from ${answered_by}"
          echo "ref=${resolved}" >> "$GITHUB_OUTPUT"
          # --->8--- end kit-ref resolution

      - name: Take the kit the caller pinned
        uses: actions/checkout@v7
        with:
          repository: mike-bronner/herdr-plugin-kit
          ref: ${{ steps.kit.outputs.ref }}
          path: kit

      # 🚨 Without this the kit is a suggestion. Three hand-maintained copies
      # of bin/ diverge in silence; one template diverges in a failing build.
      # It writes nothing. SCOPE.md §10.0.
      - name: The shims still match the kit
        run: python3 kit/templates/sync_bin.py plugin --check

      # 🚨 The load-bearing one. Under download-by-default a manifest that
      # disagrees with its tag means every install requests an asset that does
      # not exist and compiles instead, and the plugin still works, so nothing
      # surfaces. SCOPE.md §11.4 and §12.2.
      - name: The versions agree, and the tag form is the right one
        run: python3 kit/tools/plugin_gate.py versions plugin

      - name: The targets the release will publish
        id: table
        run: echo "matrix=$(python3 kit/tools/plugin_gate.py matrix)" >> "$GITHUB_OUTPUT"

  gates:
    name: Suite, formatting and lint
    runs-on: ${{ inputs.test_os }}
    steps:
      - uses: actions/checkout@v7

      - name: Take the linters
        run: rustup component add clippy rustfmt

      - name: Run the suite
        run: cargo test --locked

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Lint with warnings denied
        run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: ${{ matrix.platform }}
    needs: conformance
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every platform's answer is wanted. One target failing to compile is a
      # platform that would silently fall back to compiling on every install,
      # and hiding the other five behind it helps nobody.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.conformance.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # musl links its libc statically, so the published binary carries no
      # glibc floor. The linker driver comes from the distribution.
      - name: Take the musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Take the standard library for this target
        run: rustup target add ${{ matrix.target }}

      # ⚠️ Not --release. This job answers "does it compile and link here?",
      # which is the entire Windows guarantee and is what a pull request needs
      # to know. plugin-release.yml builds the release profile, and these
      # plugins set no LTO, so there is nothing the release profile compiles
      # that this does not.
      - name: Compile for ${{ matrix.target }}
        run: cargo build --locked --target ${{ matrix.target }}
