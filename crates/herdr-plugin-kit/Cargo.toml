[package]
name = "herdr-plugin-kit"
version = "0.5.0"
description = "Shared building blocks for Herdr plugins, generated from Herdr's own API schema"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "herdr_plugin_kit"
path = "src/lib.rs"

# Nothing is on by default. 🔑 recent-spaces is a headless watcher, and the
# whole point of gating the dialogs is that it never compiles popup machinery
# or a terminal library. See SCOPE.md section 7.5.
[features]
default = []
dialog = ["dep:crossterm"]

# Costs no dependency: SCOPE.md §7.4 opens its popup through `plugin.pane.open`,
# which is a socket call rather than terminal drawing.
#
# ⚠️ It does **not** turn on `dialog`, and that was checked rather than assumed.
# `crossterm` is used in `dialog` only from the raw-mode and key-decoding code,
# never from the `Transport` seam, so the seam moved to `surface` and `report`
# reaches it without pulling the dependency in. recent-spaces is a headless
# watcher and pays nothing for reporting its issues.
report = []

# 🔑 Costs no dependency. The release check shells out to curl (SCOPE.md §9.8)
# and the apply step spawns Herdr's own CLI, so a consumer that wants updates
# does not pay for an HTTP stack.
#
# ⚠️ It does **not** turn on `dialog`. SCOPE.md §8.2 names `dialog::ask` as the
# prompt channel, and that is what a plugin calls: `update` answers a value and
# the plugin decides. Prompting from inside would pull `crossterm` into every
# consumer that wanted updates, including a headless watcher.
update = []

# Draws every dialog combination locally, so judging the palette does not need
# a temporary plugin linked into a live Herdr server. It is what the palette
# was reviewed and approved from on 2026-09-11, after three trips to a live
# server had failed to settle it.
#
# `required-features` rather than a cfg inside the file: without it, building
# all targets with the feature off would try to compile an example whose every
# import is gated away. See SCOPE.md section 7.5.
[[example]]
name = "preview"
required-features = ["dialog"]

# No [build-dependencies] and no build.rs, on purpose. The wire types are
# generated ahead of time and committed, so `typify` never becomes a
# dependency of a plugin that consumes this crate. See SCOPE.md section 3.4.
[dependencies]
crossterm = { workspace = true, optional = true }
interprocess.workspace = true
regress.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Test-only. See the workspace manifest for why this costs consumers nothing.
[dev-dependencies]
unicode-width.workspace = true
