[package]
name = "herdr-plugin-kit"
version = "0.1.0"
description = "Shared building blocks for Herdr plugins, generated from Herdr's own API schema"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "herdr_plugin_kit"
path = "src/lib.rs"

# Nothing is on by default. 🔑 recent-spaces is a headless watcher, and the
# whole point of gating the dialogs is that it never compiles popup machinery
# or a terminal library. See SCOPE.md section 7.5.
[features]
default = []
dialog = ["dep:crossterm"]

# Draws every dialog combination locally, so checking the unmeasured palette
# does not need a temporary plugin linked into a live Herdr server.
#
# `required-features` rather than a cfg inside the file: without it, building
# all targets with the feature off would try to compile an example whose every
# import is gated away. See SCOPE.md section 7.5.
[[example]]
name = "preview"
required-features = ["dialog"]

# No [build-dependencies] and no build.rs, on purpose. The wire types are
# generated ahead of time and committed, so `typify` never becomes a
# dependency of a plugin that consumes this crate. See SCOPE.md section 3.4.
[dependencies]
crossterm = { workspace = true, optional = true }
interprocess.workspace = true
regress.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Test-only. See the workspace manifest for why this costs consumers nothing.
[dev-dependencies]
unicode-width.workspace = true
