[package]
name = "herdr-plugin-kit"
version = "0.1.0"
description = "Shared building blocks for Herdr plugins, generated from Herdr's own API schema"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "herdr_plugin_kit"
path = "src/lib.rs"

# Nothing is on by default. 🔑 recent-spaces is a headless watcher, and the
# whole point of gating the dialogs is that it never compiles popup machinery
# or a terminal library. See SCOPE.md section 7.5.
[features]
default = []
dialog = ["dep:crossterm"]

# No [build-dependencies] and no build.rs, on purpose. The wire types are
# generated ahead of time and committed, so `typify` never becomes a
# dependency of a plugin that consumes this crate. See SCOPE.md section 3.4.
[dependencies]
crossterm = { workspace = true, optional = true }
regress.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
