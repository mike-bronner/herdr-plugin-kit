[workspace]
members = ["crates/herdr-plugin-kit", "crates/herdr-plugin-kit-build"]
resolver = "2"

[workspace.package]
edition = "2021"
# 🔑 No `rust-version`, decided by Mike 2026-09-11. These plugins ship as
# compiled binaries, so a consumer needs no toolchain at all — that is the
# whole point of download-by-default. A floor documents a requirement for
# people who will never compile, and the number it would carry is whatever the
# dependency tree currently demands rather than anything this project chose.
#
# ⚠️ One case is not useless, and it is recorded rather than argued with: the
# shim's fallback path does compile from source when a fetch fails, so a user
# on that path with an old toolchain gets a compile error. That failure is
# loud and names itself, which is why it does not justify keeping a claim that
# was measurably false. SCOPE.md §11.8 records what the tree demands today.
license = "MIT"
repository = "https://github.com/mike-bronner/herdr-plugin-kit"

[workspace.dependencies]
# Optional, and reached only through the `dialog` feature. ⚠️ It fails the bar
# `toml` cleared below: crossterm is a direct dependency of one donor plugin
# rather than all three. It is bought anyway because reading a single keypress
# needs raw mode, and the alternative is hand-rolled termios against a crate
# root that forbids unsafe. 0.29 is the version agentic-panes-layout already
# pins. See crates/herdr-plugin-kit/src/dialog.rs.
crossterm = "0.29"
# ⚠️ It fails the bar `toml` cleared below, and harder than `crossterm` did:
# **no** donor plugin depends on it, because all three reach for `std`'s
# `UnixStream`. Bought anyway, and not as a convenience: `HERDR_SOCKET_PATH`
# is a named pipe on Windows, so all three donor clients are Unix-only and
# none of them can be promoted as written. This crate puts one API over both,
# it is what Herdr itself depends on, and SCOPE.md §4.2 sanctions this exact
# version. Its own declared floor is 1.75, and at run time it pulls in `libc`
# and nothing else.
# See crates/herdr-plugin-kit/src/api/client.rs.
interprocess = "2.4.4"
regress = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already a dependency of all three donor plugins, so the kit adds nothing
# to any consumer's graph by reading `herdr-plugin.toml` with it.
toml = "0.8"
# 🔬 Test-only, and never in a consumer's graph: a dev-dependency is not part
# of the dependency tree of anything that depends on this crate. It exists so
# the dialog glyphs' width rule is asserted against the real Unicode data
# rather than against a hand-copied list of codepoints.
unicode-width = "0.2"
